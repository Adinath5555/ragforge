# A generic, single database configuration.

[alembic]

# Path to migration scripts.
script_location = %(here)s/alembic

# Add the project root to Python's import path.
prepend_sys_path = .

# Use the operating system path separator.
path_separator = os

# Database URL is loaded from app/core/config.py
# and .env by alembic/env.py.
sqlalchemy.url =


[post_write_hooks]

# Logging configuration.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers = console
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S